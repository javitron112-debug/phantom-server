<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PHANTOM V24.1 | PRO E2EE</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --neon: #00ff41; --sos: #ff3131; --ptt: #ff8c00; --rx: #0088ff; --bg: #050508; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; }
        .app-shell { flex: 1; display: flex; flex-direction: column; padding: 15px; padding-bottom: 90px; box-sizing: border-box; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
        .user-menu { position: relative; }
        #user-list-btn { background: #111; color: var(--neon); border: 1px solid #333; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        #user-dropdown { position: absolute; right: 0; top: 30px; background: #111; border: 1px solid var(--neon); padding: 10px; border-radius: 8px; z-index: 100; display: none; min-width: 150px; }
        #status-led { width: 10px; height: 10px; border-radius: 50%; background: #333; }
        .led-tx { background: var(--sos) !important; box-shadow: 0 0 10px var(--sos); }
        .led-rx { background: var(--rx) !important; box-shadow: 0 0 10px var(--rx); }
        .emergency-tools { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .btn-alert { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; min-width: 80px; }
        #sos-btn { background: var(--sos); }
        #invite-btn { background: var(--neon); color: black; }
        #rafagas-panel { background: #111; border: 1px solid #333; border-radius: 8px; padding: 5px; margin-bottom: 10px; min-height: 40px; display: flex; overflow-x: auto; gap: 5px; align-items: center; }
        .rafaga-btn { background: #222; border: 1px solid var(--neon); color: var(--neon); font-size: 10px; padding: 5px 10px; border-radius: 15px; cursor: pointer; white-space: nowrap; }
        #chat { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 10px; border: 1px solid #111; margin-bottom: 10px; display: flex; flex-direction: column; max-height: 35vh; }
        .msg { background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--neon); font-size: 12px; position: relative; word-wrap: break-word; }
        .msg-time { position: absolute; right: 8px; top: 8px; font-size: 9px; color: #555; }
        #talk-btn { width: 100%; padding: 40px 0; border-radius: 20px; border: 2px solid #333; background: #111; color: #444; font-weight: 900; font-size: 20px; touch-action: manipulation; margin: 10px 0; -webkit-touch-callout: none; }
        #talk-btn.ready { background: var(--ptt); color: black; }
        #talk-btn.active { background: var(--sos); color: white; }
        .input-area { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; gap: 8px; padding: 15px; background: #000; border-top: 1px solid #222; box-sizing: border-box; }
        #msg-in { background: #111; border: 1px solid #333; color: var(--neon); padding: 12px; border-radius: 10px; flex: 1; outline: none; }
        #auth-overlay { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .card { background: #0a0a0a; padding: 25px; border-radius: 25px; border: 1px solid var(--neon); width: 85%; max-width: 380px; }
        .card input { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        #invite-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <form class="card" onsubmit="event.preventDefault(); startEnlace();">
        <h2 style="color: var(--neon); text-align: center; margin-top:0;">PHANTOM V24.1</h2>
        <div id="setup-fields">
            <input type="text" id="url-in" placeholder="URL SERVER WSS" required>
            <input type="text" id="room-in" placeholder="CANAL" required>
            <input type="password" id="pass-in" placeholder="CONTRASEÑA SALA" required>
        </div>
        <input type="text" id="nick-in" placeholder="ID OPERADOR" required>
        <button type="submit" style="width:100%; padding:15px; background:var(--neon); border:none; border-radius:10px; font-weight:bold; cursor:pointer; color:black;">CONECTAR</button>
    </form>
</div>

<div id="invite-overlay" onclick="this.style.display='none'">
    <div style="background:white; padding:15px; border-radius:15px;" id="invite-qrcode"></div>
    <p style="color:var(--neon); margin-top:15px; font-weight:bold;">ESCANEAME PARA ENTRAR</p>
    <button onclick="copyInviteLink(event)" style="background:transparent; border:1px solid var(--neon); color:var(--neon); padding:10px; border-radius:8px; margin-top:10px;">O COPIAR ENLACE</button>
</div>

<div class="app-shell">
    <header>
        <div id="status-led"></div>
        <div class="user-menu">
            <button id="user-list-btn" onclick="toggleUsers()">OPERADORES: 0 ▾</button>
            <div id="user-dropdown"></div>
        </div>
    </header>
    <div class="emergency-tools">
        <button id="sos-btn" class="btn-alert" onclick="triggerAlert('SOS')">🚨 SOS</button>
        <button id="invite-btn" class="btn-alert" onclick="generateInviteQR()">➕ INVITAR</button>
    </div>
    
    <div id="rafagas-panel">
        <span style="font-size:10px; color:#555; margin-right:5px;">RÁFAGAS:</span>
        <div id="rafagas-list" style="display:flex; gap:5px;"></div>
    </div>

    <div id="chat"></div>
    <button id="talk-btn" disabled oncontextmenu="return false;">STANDBY</button>
</div>

<div class="input-area">
    <input type="text" id="msg-in" placeholder="Mensaje seguro..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()" style="background:var(--neon); border:none; border-radius:10px; width:50px; font-weight:bold;">></button>
</div>

<div id="audio-container" style="display:none;"></div>

<script>
    let socket, localStream, myNick, roomName, wakeLock = null;
    let peers = {}; 
    let mediaRecorder, audioChunks = [];
    let aesKey = null; 
    
    // ENRUTAMIENTO UNIVERSAL A TU CASA
    const rtcConfig = { 
        iceServers: [
            { urls: 'stun:192.168.2.233:3478' },
            { 
                urls: 'turn:192.168.2.233:3478',
                username: 'phantom_oper',
                credential: 'tactical_pass_2026'
            }
        ] 
    };
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    window.onload = () => {
        const hash = window.location.hash.substring(1);
        if (hash && hash.startsWith('inv=')) {
            try {
                const data = JSON.parse(atob(hash.split('=')[1]));
                document.getElementById('url-in').value = data.url;
                document.getElementById('room-in').value = data.room;
                document.getElementById('pass-in').value = data.pass;
                document.getElementById('setup-fields').style.display = 'none';
            } catch(e) { }
        }
    };

    async function deriveAESKey(password, room) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: enc.encode(room + "-phantom-v24"), iterations: 250000, hash: "SHA-256" },
            keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function encryptAudioBlob(blob) {
        const arrayBuffer = await blob.arrayBuffer();
        const iv = crypto.getRandomValues(new Uint8Array(12)); 
        const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, arrayBuffer);
        const payload = new Uint8Array(iv.length + ciphertext.byteLength);
        payload.set(iv, 0); payload.set(new Uint8Array(ciphertext), iv.length);
        return payload.buffer;
    }

    async function decryptAudioBuffer(buffer) {
        const data = new Uint8Array(buffer);
        const iv = data.slice(0, 12); const ciphertext = data.slice(12);
        try {
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, ciphertext);
            return new Blob([decrypted], { type: 'audio/webm' });
        } catch (e) { return null; }
    }

    async function startEnlace() {
        const url = document.getElementById('url-in').value;
        roomName = document.getElementById('room-in').value;
        const pass = document.getElementById('pass-in').value;
        myNick = document.getElementById('nick-in').value;

        aesKey = await deriveAESKey(pass, roomName);

        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("API bloqueada. Requiere HTTPS.");
            localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
            localStream.getAudioTracks()[0].enabled = false; 
        } catch (err) {
            alert(`Fallo de Micrófono:\n${err.message}`);
            return;
        }

        socket = io(url, { auth: { token: pass } }); 
        socket.on('connect', () => socket.emit('join-room', { roomName: roomName, nickname: myNick }));
        socket.on('joined-success', () => {
            document.getElementById('auth-overlay').style.display = 'none';
            setupApp();
            socket.emit('request-peers'); 
        });
    }

    function setupApp() {
        const btn = document.getElementById('talk-btn');
        btn.disabled = false; btn.innerText = "PULSAR PARA HABLAR"; btn.classList.add('ready');

        socket.on('user-list', list => {
            document.getElementById('user-list-btn').innerText = `OPERADORES: ${list.length} ▾`;
            document.getElementById('user-dropdown').innerHTML = list.map(u => `<div style="padding:5px; font-size:10px; border-bottom:1px solid #222;">● ${u}</div>`).join('');
        });

        socket.on('chat-message', d => addMessage(`<b>${d.user}:</b> ${d.text}`, d.time));

        socket.on('audio-history', history => {
            const list = document.getElementById('rafagas-list');
            list.innerHTML = history.map(h => `<button class="rafaga-btn" onclick="requestAudioPlayback('${h.id}')">▶ ${h.user} (${h.time})</button>`).join('');
        });

        socket.on('deliver-audio', async data => {
            const blob = await decryptAudioBuffer(data.buffer);
            if (blob) {
                const audioUrl = URL.createObjectURL(blob);
                const audioObj = new Audio(audioUrl);
                audioObj.play();
                audioObj.onended = () => URL.revokeObjectURL(audioUrl); 
            } else {
                addMessage(`<b style="color:var(--sos)">Error: Audio corrupto o clave incorrecta.</b>`);
            }
        });

        socket.on('ptt-active', u => {
            if(u !== myNick) {
                btn.disabled = true; btn.innerText = `RX: ${u.toUpperCase()}`;
                document.getElementById('status-led').classList.add('led-rx');
            }
        });

        socket.on('ptt-inactive', () => {
            btn.disabled = false; btn.innerText = "PULSAR PARA HABLAR";
            document.getElementById('status-led').classList.remove('led-rx');
        });

        setupWebRTCSignaling();
        initPTTLogic(btn);
    }

    function requestAudioPlayback(audioId) { socket.emit('request-audio', audioId); }

    function setupWebRTCSignaling() {
        socket.on('user-joined', async (userId) => {
            const peerConnection = createPeerConnection(userId);
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('webrtc-signal', { target: userId, type: 'offer', data: offer });
        });

        socket.on('webrtc-signal', async ({ sender, type, data }) => {
            let pc = peers[sender];
            if (!pc && type === 'offer') pc = createPeerConnection(sender);
            if (type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('webrtc-signal', { target: sender, type: 'answer', data: answer });
            } else if (type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data));
            } else if (type === 'ice-candidate') {
                await pc.addIceCandidate(new RTCIceCandidate(data));
            }
        });

        socket.on('user-disconnected', userId => {
            if(peers[userId]) { peers[userId].close(); delete peers[userId]; }
        });
    }

    function createPeerConnection(userId) {
        const pc = new RTCPeerConnection(rtcConfig);
        peers[userId] = pc;
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

        pc.ontrack = event => {
            let audioEl = document.getElementById(`audio-${userId}`);
            if (!audioEl) {
                audioEl = document.createElement('audio'); audioEl.id = `audio-${userId}`;
                audioEl.autoplay = true; audioEl.playsInline = true;
                document.getElementById('audio-container').appendChild(audioEl);
            }
            audioEl.srcObject = event.streams[0];
            audioEl.play().catch(e => console.warn("Autoplay bloqueado.", e));
        };
        return pc;
    }

    function initPTTLogic(btn) {
        const startTx = (e) => {
            if(btn.disabled || btn.classList.contains('active')) return;
            if(e.cancelable) e.preventDefault();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            localStream.getAudioTracks()[0].enabled = true;
            btn.classList.add('active');
            document.getElementById('status-led').classList.add('led-tx');
            socket.emit('ptt-active');

            audioChunks = [];
            mediaRecorder = new MediaRecorder(localStream);
            mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
            mediaRecorder.start();
        };

        const stopTx = () => {
            if(btn.classList.contains('active')) {
                localStream.getAudioTracks()[0].enabled = false;
                btn.classList.remove('active');
                document.getElementById('status-led').classList.remove('led-tx');
                socket.emit('ptt-inactive');
                playRogerBeep();

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size > 0) {
                        const encryptedBuffer = await encryptAudioBlob(blob);
                        socket.emit('store-audio', encryptedBuffer);
                    }
                };
                mediaRecorder.stop();
            }
        };

        btn.addEventListener('touchstart', startTx, { passive: false });
        btn.addEventListener('touchend', stopTx);
        btn.addEventListener('mousedown', startTx);
        btn.addEventListener('mouseup', stopTx);
        btn.addEventListener('mouseleave', stopTx);
    }

    function addMessage(html, time) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="msg-time">${time || new Date().toLocaleTimeString()}</span>` + html;
        chat.appendChild(div);
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    }

    function playRogerBeep() {
        if(!audioCtx) return;
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(1000, audioCtx.currentTime);
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.1);
    }

    function sendMsg() {
        const i = document.getElementById('msg-in');
        if(i.value.trim()){ socket.emit('chat-message', i.value); i.value = ""; }
    }
</script>
</body>
</html>
